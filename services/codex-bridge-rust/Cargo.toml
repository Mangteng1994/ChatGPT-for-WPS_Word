[package]
name = "codex-for-wps-word-rust"
version = "0.1.0"
edition = "2021"

[features]
# 把加载项与面板静态资源编进可执行文件，供单文件分发使用。
# 默认关闭：开发时仍从 apps/ 目录读取，改完面板刷新即可生效。
embedded-assets = []

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
